# Локальный запуск PostgreSQL и тестовой почты в Docker (раздел 18.5).
# Не обязателен, если PostgreSQL уже установлен на компьютере.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: traintix
      POSTGRES_PASSWORD: traintix
      POSTGRES_DB: traintix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit: # тестовая почта: письма видны на http://localhost:8025
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # веб-интерфейс

volumes:
  pgdata:
